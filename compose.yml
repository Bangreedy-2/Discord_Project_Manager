services:
  
  db:
    image: postgres:17
    environment:
      POSTGRES_PASSWORD: $POSTGRES_PASSWORD
    ports: ["5432:5432"]
    volumes:
      - ./supabase/migrations:/migrations:ro
      - ./db/init.sh:/docker-entrypoint-initdb.d/00-init.sh:ro
      - ./db/data:/migrations-data:ro

    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 10
  bot:
    depends_on:
      db:
        condition: service_healthy

    container_name: discord_bot
    image: discord_bot
    build:
      context: .
      dockerfile: Dockerfile
    
    env_file:
      - .env
  